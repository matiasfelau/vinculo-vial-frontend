name: Android Build, Test and Release

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura para todo el workflow. El único paso que necesita escribir (publicar el release) vive en
# el job `publish`, que no corre en los PRs.
permissions:
  contents: read

env:
  # Versiones de las herramientas de CI, fijadas para que el resultado sea reproducible.
  DIFF_COVER_VERSION: 11.0.2
  SEMGREP_VERSION: 1.185.0
  COVERAGE_THRESHOLD: "85"

jobs:
  build-test-package:
    name: Build, test and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # diff-cover necesita el historial para comparar con la rama base del PR.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # testReleaseUnitTest corre además la guardia del manifiesto mergeado de release (US-08):
      # sin permisos de lectura de medios y sin el código del picker de la galería.
      # koverXmlReportDebug mide con las pruebas de testDebugUnitTest (unitarias y de pantalla con
      # Robolectric) y las exporta en formato JaCoCo, que es el que lee diff-cover.
      - name: Run unit tests (JVM) with coverage
        run: ./gradlew testDebugUnitTest testReleaseUnitTest koverXmlReportDebug --console=plain

      # Se publica en el resumen del job, aunque las pruebas hayan fallado.
      - name: Publish total coverage
        if: always()
        run: |
          report=app/build/reports/kover/reportDebug.xml
          if [ -f "$report" ]; then
            python3 - "$report" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          c = next(x for x in r.findall("counter") if x.get("type") == "LINE")
          cov, mis = int(c.get("covered")), int(c.get("missed"))
          print("## Cobertura total")
          print()
          print(f"- Líneas (Kover): **{100 * cov / (cov + mis):.2f} %** ({cov} de {cov + mis})")
          PY
          fi

      # Segundo gate, sobre el total del repo: koverVerifyDebug falla si las líneas cubiertas bajan de 85 %
      # (regla `verify` en el bloque kover de app/build.gradle.kts), además del de diff-cover sobre el código
      # nuevo. Ninguna rama puede bajar el total de 85 %. Las exclusiones (hardware y servicios de Google) están
      # marcadas con @ExcludeFromCoverage y listadas en el README.
      - name: Coverage gate (>= 85 % lines)
        run: ./gradlew :app:koverVerifyDebug --console=plain

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: app/build/reports/kover/reportDebug.xml
          if-no-files-found: ignore

      # Solo en PR: en un push no hay rama contra la que comparar.
      - name: Coverage of new code (diff-cover)
        if: github.event_name == 'pull_request'
        env:
          # Por variable de entorno y no interpolado en el script: el nombre de la rama lo controla
          # quien abre el PR (inyección de shell).
          BASE_REF: ${{ github.base_ref }}
        run: |
          python -m pip install --quiet "diff-cover==${DIFF_COVER_VERSION}"
          git fetch --no-tags origin "$BASE_REF"
          status=0
          diff-cover app/build/reports/kover/reportDebug.xml \
            --compare-branch="origin/$BASE_REF" \
            --src-roots app/src/main/java \
            --fail-under="${COVERAGE_THRESHOLD}" \
            --format "markdown:diff-cover.md" || status=$?
          {
            echo "## Cobertura del código nuevo (mínimo ${COVERAGE_THRESHOLD} %)"
            echo
            cat diff-cover.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Locate generated debug APK
        id: debug_apk
        run: |
          apk_path=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$apk_path" ]; then
            echo "No se encontro ningun APK en app/build/outputs/apk/debug" >&2
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug-apk
          path: ${{ steps.debug_apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Release Build: solo se arma para un push de tag "vX.Y.Z" -- es el que se publica
      # como Asset del GitHub Release. isMinifyEnabled/isShrinkResources ya estan activados
      # en el buildType release (ver app/build.gradle.kts); la firma hoy es la de debug
      # (autogenerada por AGP, sin secretos) para que el APK sea instalable -- todavia no es
      # apta para Play Store, ver el comentario junto a esa linea en build.gradle.kts.
      - name: Assemble release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --console=plain

      - name: Locate generated release APK
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_apk
        run: |
          apk_path=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$apk_path" ]; then
            echo "No se encontro ningun APK en app/build/outputs/apk/release" >&2
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload release APK as workflow artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release-apk
          path: ${{ steps.release_apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Gate: falla ante HIGH o CRITICAL con corrección disponible. Lee app/gradle.lockfile (ver
      # `resolveAndLockAll` en app/build.gradle.kts). Las excepciones viven solo en .trivyignore, con el
      # motivo y la fecha de revisión.
      - name: Trivy (vulnerabilities, secrets and misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      # Informativo por ahora: no corta el job. Pasa a gate en v0.14.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Semgrep
        continue-on-error: true
        run: |
          python -m pip install --quiet "semgrep==${SEMGREP_VERSION}"
          semgrep scan --config p/default --json --output semgrep.json || true
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          results = json.load(open("semgrep.json")).get("results", [])
          por_severidad = collections.Counter(r["extra"]["severity"] for r in results)
          print("## Semgrep (informativo)")
          print()
          if not results:
              print("Sin hallazgos.")
          else:
              print(f"{len(results)} hallazgos: " + ", ".join(f"{n} {s}" for s, n in sorted(por_severidad.items())))
              print()
              for r in results[:20]:
                  print(f"- `{r['path']}:{r['start']['line']}` {r['check_id']}")
          PY

  # El único job que escribe en el repositorio. Solo corre para un tag "vX.Y.Z" o un push a main, nunca
  # en un PR, y recibe los APK ya armados como artefactos del job de build.
  publish:
    name: Publish release
    needs: build-test-package
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-debug-apk
          path: apk-debug

      - name: Download release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-release-apk
          path: apk-release

      # Release versionado: solo corre cuando el push trae un tag "vX.Y.Z". El nombre y las
      # notas del release usan el tag tal cual, sin generar contenido adicional. El Asset es
      # el Release Build (minificado y firmado), no el de debug.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: apk-release/*.apk
          generate_release_notes: true

      # Build continuo de main: mantiene un unico release movil ("latest-main") con el
      # APK de debug mas reciente, separado de los releases versionados por tag.
      - name: Publish rolling main build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: latest-main
          name: "Build mas reciente de main"
          prerelease: true
          files: apk-debug/*.apk
